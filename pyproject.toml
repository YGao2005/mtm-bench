[project]
name = "mtm-bench"
version = "0.1.0"
description = "MtM-Bench (Measuring the Measurers): a meta-evaluation benchmark that grades the graders of agent transcripts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.scripts]
mtm-bench = "mtm_bench.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
judge = ["anthropic[bedrock]>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtm_bench"]

[tool.ruff]
line-length = 100
