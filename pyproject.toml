[project]
name = "mtm-bench"
version = "0.1.0"
description = "MtM-Bench (Measuring the Measurers): a meta-evaluation benchmark that grades the graders of agent transcripts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.scripts]
mtm-bench = "mtm_bench.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
judge = ["anthropic[bedrock]>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtm_bench"]

[tool.ruff]
line-length = 100

# Pin the rule set explicitly. Relying on ruff's defaults makes CI depend on whichever ruff
# version the runner resolves — a newer default set silently changes which `# noqa` directives
# are needed (e.g. dropping E402 turns every `# noqa: E402` in scripts/ into an RUF100
# "unused directive" error, which is exactly how CI broke while local lint stayed green).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
